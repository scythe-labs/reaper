[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "reaper"
version = "0.1.0"
description = "Explainable media library pruning for Plex, Sonarr, Radarr, Seerr and Tautulli"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
authors = [{ name = "Scythe Labs" }]

# Version floors are the exact releases verified on PyPI on 2026-07-23.
dependencies = [
    # Web
    "fastapi>=0.139.2",          # >=0.138 for app.frontend(), >=0.135 for fastapi.sse
    "starlette>=1.3.1,<2.0.0",   # PIN: 1.0 removed on_startup/on_shutdown; FastAPI declares no upper bound
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.1.0",      # imported directly (config.load_raw_env), not only transitively
    # Persistence
    "sqlalchemy>=2.0.51",        # plain SQLAlchemy, NOT SQLModel (see docs/STATUS.md)
    "alembic>=1.18.5",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.4",
    # Integrations
    "httpx2>=2.9.0",
    "plexapi>=4.18.2",
    "tenacity>=9.1.4",
    # Scheduling — 3.x, NOT 4.x (still alpha: 4.0.0a6, 14 months stale)
    "apscheduler>=3.11.3,<4.0.0",
    "tzlocal>=5.0",              # imported directly (app_settings host-zone detection), not only via apscheduler
    # Secrets & auth
    "cryptography>=49.0.0",      # Fernet, for API keys at rest
    "pwdlib[argon2]>=0.3.0",     # NOT passlib (dead since 2020-10-08)
    # Observability
    "structlog>=26.1.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",             # dev-only: no production import remains; respx speaks httpx only, not httpx2
    "respx>=0.23.1",             # httpx mocking (respx speaks httpx only, not httpx2)
    "hypothesis>=6.161.0",       # property tests for the scoring invariants
    "pytest-xdist>=3.8.0",
    "pytest-httpx2>=1.0.0",      # httpx2 mocking; respx cannot (see docs/history/PLAN-narrative.md httpx2 scope)
    "pyyaml>=6.0.3",             # imported directly (test_repo_hygiene reads the CI config), not only via uvicorn[standard]
]

[project.scripts]
# The out-of-band escape hatch. Run inside the container:
#   docker exec -it reaper reaper-admin reset-password --username admin
reaper-admin = "reaper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Migration bodies are machine-generated by `alembic revision --autogenerate`.
# Linting them means hand-editing every generated file for no benefit.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "DTZ",       # flake8-datetimez — naive datetimes are a real bug class here
    "T20",       # no print()
    "SIM",       # simplify
    "PTH",       # use pathlib
    "RUF",
    "ASYNC",     # async footguns (blocking calls in async defs)
    "S",         # bandit
]
ignore = [
    "S101",      # assert — we use it in tests and for invariants
    # ASYNC109: prefers asyncio.timeout() over a `timeout` parameter. Our timeouts
    # are passed through to httpx, which handles them at the transport layer where
    # they belong — wrapping in asyncio.timeout would cancel mid-request instead.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S311"]   # fake secrets in fixtures; seeded rng in generators
"scripts/*" = ["S311", "T201"]                 # dev tools: seeded rng, console output

[tool.ruff.lint.isort]
known-first-party = ["reaper"]

# ----------------------------------------------------------------------------
# mypy — strict. The scoring engine's safety depends on exhaustive matching
# over Observation[T] (Known | Unknown | Absent), which only strict mode enforces.
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_explicit = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["plexapi.*", "apscheduler.*"]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config -m 'not live'"
markers = [
    "live: talks to a real instance; requires .env.local. Deselected by default.",
    # pytest-httpx2 registers this in its own pytest_configure, but exposes only the
    # fixture (not the hook) from its package __init__, so under --strict-markers we must
    # declare it here. Configures the httpx2_mock fixture (assert_all_called, base_url, ...).
    "httpx2: configure the httpx2_mock fixture (see pytest-httpx2).",
]

[tool.coverage.run]
source = ["src/reaper"]
branch = true
