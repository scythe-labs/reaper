name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # Fail if uv.lock has drifted from pyproject.toml. Without this, a dependency bump
      # that never made it into the lock would still pass CI while the image installs the
      # stale locked versions -- exactly the reproducibility gap we install --frozen to close.
      - name: Assert lockfile is current
        run: uv lock --check

      # Install from the committed lockfile, not the `>=` floors, so CI tests the same
      # hash-pinned tree the image ships. `--no-emit-project` leaves reaper out of the
      # exported set; it is installed editable (with --no-deps) in the next step.
      - name: Install
        run: |
          uv export --frozen --extra dev --no-emit-project -o requirements-dev.txt
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Typecheck
        run: mypy src/reaper

      - name: Test
        run: pytest --cov --cov-report=term-missing

      # A model change without a migration is the classic way to ship a schema
      # that only exists on the developer's laptop.
      - name: Assert no un-migrated model changes
        run: |
          alembic upgrade head
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: it installs exactly the locked tree and fails if
      # package.json and the lockfile disagree, rather than quietly resolving something
      # new. This is the same command the Dockerfile runs.
      - name: Install
        run: npm ci

      # `npm run build` runs tsc --noEmit first, so a type error fails the build rather
      # than shipping a bundle that throws in the browser.
      - name: Typecheck and build
        run: npm run build

  # The shipped artifact is the container, so its buildability must be a checked gate --
  # otherwise a broken COPY order, a stale lock, or a bad base image reaches main green.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t reaper:ci .
