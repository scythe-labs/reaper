<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The color the browser paints its own chrome with: Safari's tab bar, Chrome's
         toolbar. Ships at the built-in accent and is rewritten to the install's accent by
         the pre-paint below and by accent.ts. The web manifest's theme_color is a static
         file and cannot follow a per-install setting, so this tag is what carries it. -->
    <meta id="theme-color" name="theme-color" content="#25c3ff" />
    <title>Reaper</title>
    <!-- Raster fallback FIRST, the accent-following SVG (#favicon, rewritten by accent.ts and
         the pre-paint script below) LAST: when two icons are equally appropriate the HTML spec
         has the browser use the last declared, and a sized PNG is a strong match, so the SVG
         must come after it or a browser shows the stale default icon forever (B-11). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme override before first paint, so a dark-choice page never
      // flashes light (or vice versa). "system" stores nothing and the device decides.
      try {
        var reaperTheme = localStorage.getItem("reaper-theme");
        if (reaperTheme === "dark" || reaperTheme === "light") {
          document.documentElement.dataset.theme = reaperTheme;
        }
      } catch (e) {
        /* storage unavailable: fall back to the device preference */
      }
      // Apply the saved accent color before first paint too, so a custom color never
      // flashes the built-in sky blue. Every value here is READ BACK from a cache
      // accent.ts's applyAccent writes; none of the color maths is repeated in this file.
      // It used to re-implement accentInk with the dark ink's luminance rounded to 0.012
      // (the real value is 0.0125359), so for accents around L = 0.2055 the two disagreed
      // and the ink on every accent-filled button flipped at first paint -- the exact flash
      // this script exists to prevent (B-34). On the first load after an upgrade the ink
      // cache is not written yet, so the stylesheet default stands for that one paint.
      try {
        var reaperAccent = localStorage.getItem("reaper-accent");
        if (reaperAccent && /^#[0-9a-fA-F]{6}$/.test(reaperAccent)) {
          document.documentElement.style.setProperty("--accent", reaperAccent);
          var reaperChrome = document.getElementById("theme-color");
          if (reaperChrome) reaperChrome.content = reaperAccent;
        }
        var reaperAccentInk = localStorage.getItem("reaper-accent-ink");
        if (reaperAccentInk && /^#[0-9a-fA-F]{6}$/.test(reaperAccentInk)) {
          document.documentElement.style.setProperty("--accent-ink", reaperAccentInk);
        }
      } catch (e) {
        /* storage unavailable: the stylesheet default accent stands */
      }
      // The accent's readable text inks, the same way. accent.ts searches for these
      // (accentText), and the stylesheet's own fallback covers the built-in accent, so all
      // that is missing before first paint is a CUSTOM accent's measured pair. Cached as
      // "#light #dark".
      try {
        var reaperInk = localStorage.getItem("reaper-accent-text");
        if (reaperInk && /^#[0-9a-fA-F]{6} #[0-9a-fA-F]{6}$/.test(reaperInk)) {
          var inks = reaperInk.split(" ");
          var inkRoot = document.documentElement;
          inkRoot.style.setProperty("--accent-text-light", inks[0]);
          inkRoot.style.setProperty("--accent-text-dark", inks[1]);
        }
      } catch (e) {
        /* storage unavailable: the stylesheet's built-in fallback stands */
      }
      // Apply the saved tab favicon before first paint too, so a custom accent does not flash
      // the default sky icon. accent.ts caches the app icon as a data URI under this key; here
      // we only read it back, so the icon drawing lives in exactly one place (appIcon.ts).
      try {
        var reaperFavicon = localStorage.getItem("reaper-favicon");
        if (reaperFavicon && reaperFavicon.indexOf("data:image/svg+xml,") === 0) {
          var favLink = document.getElementById("favicon");
          if (favLink) favLink.href = reaperFavicon;
        }
      } catch (e) {
        /* storage unavailable: the static /favicon.svg default stands */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
