<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reaper</title>
    <!-- Closes the window plex.tv forwarded here, and never paints when that works.
         A window opened by a script may close itself even when it was opened with
         `noopener`, so Reaper keeps the operator's sign-in page unreachable from
         plex.tv and still gets the window shut. See PLEX_FORWARD_PATH in
         src/reaper/api/schemas.py for the other half. -->
    <script>
      window.close();
    </script>
    <style>
      /* This page loads outside the SPA bundle and cannot read styles/00-tokens.css,
         so the four colors below are copies of --bg, --surface, --text and --muted
         from it (rule 67). Everything here is a fallback for a browser that refused
         the close above; on every browser that allows it, none of this is painted. */
      :root {
        color-scheme: light dark;
        --bg: #f4f5f8;
        --surface: #ffffff;
        --text: #16181d;
        --muted: #666b78;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e0f13;
          --surface: #191b21;
          --text: #edeef1;
          --muted: #969cab;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        background: var(--surface);
        border-radius: 12px;
        padding: 2rem 2.25rem;
        text-align: center;
        max-width: 26rem;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
      }
      p {
        margin: 0.5rem 0 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You can close this window.</h1>
      <p>Reaper takes it from here.</p>
    </main>
  </body>
</html>
