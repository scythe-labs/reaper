version: 2

# The thing that moves a pin.
#
# Rule 15 requires the shipped artifact to build from digest-pinned base images, sha-pinned
# actions and the committed lockfiles, which is what makes two builds weeks apart the same
# build. The cost is that a pin never moves on its own: the digest that made the build
# reproducible is the same digest that holds it on an unpatched layer, so a base image
# rebuilt against a fixed libc is one nobody picks up. Nothing else in this repository
# updates them, and a pin nobody updates is the failure the pin was supposed to prevent.
#
# Three facts about this repository shape every entry below.
#
#   1. `.github/workflows/pr-validation.yml` requires a pull request title to parse as a
#      Conventional Commit, because a squash-merge makes that title the permanent commit
#      message. Dependabot titles its pull requests "Bump x from a to b" by default, which
#      does not parse, so `commit-message.prefix` is load-bearing rather than decoration:
#      without it every pull request opened from this file fails a required check. The
#      prefix has to stay a type that workflow accepts, and it is not written down there,
#      so tests/test_repo_hygiene.py holds the two files to each other.
#   2. A pull request here carries a `Kind/` and a `Priority/` label, because that is how
#      the queue is filtered and an unlabeled pull request is missing from it. Dependabot
#      applies only labels that already exist in the repository and silently drops the
#      rest, so renaming a label makes these go quiet rather than fail.
#   3. A group is one pull request and one CI run. Ungrouped, a quiet week of npm patches
#      is a dozen of each, and `docker build` runs for every one of them.
#
# Every entry quarantines a release before proposing it (`cooldown`), because the thing this
# file automates is also an attack: a compromised release looks exactly like a good one on the
# day it ships, and taking it the same morning is the whole payload. The delay is what lets
# somebody else find it first. Two facts make the cost bearable: **cooldown does not apply to
# Dependabot security updates**, so an advisory-backed fix still arrives at once, and the
# window only delays a proposal, never a hand-written bump.
#
# The window is 14 days everywhere except `docker`, which is 3. That asymmetry is deliberate
# and runs against the grain, so it is worth stating: for npm, uv and actions a new release is
# arbitrary publisher code and waiting costs nothing, but a new base image digest usually IS
# the security patch, Alpine or Debian rebuilt against a fixed libc. Holding those 14 days
# would mean knowingly shipping an unpatched layer for a fortnight to guard against a
# compromise of Docker Official Images, trading a likely exposure for an unlikely one.
# tests/test_repo_hygiene.py pins both numbers, so lowering one is a deliberate act.
#
# `docker-compose.yml` is deliberately not watched. The only image it names is Reaper's own,
# on the moving `:dev` tag that an operator is meant to follow; pinning that to a digest
# would freeze installs on whatever was current the day the pull request landed.
#
# CodeQL was raised alongside this and is a separate decision (#356).

updates:
  # Pinned action shas. A mutable tag on a third-party action is a supply-chain door into
  # the job that builds and publishes the deletion-capable image, which is why they are
  # pinned; this is what keeps the pins current. Dependabot rewrites the sha and the `# v4`
  # comment beside it together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    # One pull request for all of them. They are a handful of actions across the workflows
    # in this directory, and reviewing them together is reviewing one diff.
    groups:
      actions:
        patterns: ["*"]
    labels: ["Area/CI", "Kind/Chore", "Priority/Low"]
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5

  # The two digest-pinned base images in the Dockerfile.
  #
  # The uv image's tag (`python3.13-bookworm-slim`) carries no version to bump, so it moves
  # by digest alone, which is exactly the patched-layer case this file exists for.
  #
  # `node`'s tag does carry a version, and "the newest major" is the wrong answer for it.
  # Node promotes only even majors to LTS; an odd one is end-of-life within about eight
  # months, and the first pull request this file ever opened proposed 24 to 25, which had
  # been dead for two months when it was raised. So a major stays a human decision, made on
  # the LTS calendar rather than on what exists. Digest updates are unaffected, and they are
  # the part that carries the patch.
  #
  # A bump done by hand still needs `node-version` in `ci.yml` moved with it, or the image
  # builds on a Node the tests never ran on. tests/test_repo_hygiene.py fails a change that
  # moves one of the two, and one that lands on an odd major either way.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 3
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels: ["Area/CI", "Kind/Chore", "Priority/Low"]
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5

  # uv.lock, which is what the image installs from. The upper bounds in pyproject.toml are
  # deliberate (starlette < 2, apscheduler < 4) and the resolver honors them, so nothing
  # here has to restate them as an `ignore`.
  #
  # Patch and minor arrive grouped; a major falls out of the group and gets its own pull
  # request, because a major is a change to review on its own and not one line in twelve.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["Kind/Backend", "Kind/Chore", "Priority/Low"]
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5

  # frontend/package-lock.json. The direct dependencies are few by design (the dependency
  # budget in CONTRIBUTING.md), so the grouped pull request stays small enough to read.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 14
    groups:
      # `typescript` and `typescript-eslint` can only move together. typescript-eslint pins a
      # `typescript` peer range, so a TypeScript major raised on its own fails `npm ci` at
      # resolution and can never go green however long it waits: #364 was that pull request,
      # red from the moment it opened, and splitting the two is what made it unmergeable
      # rather than merely early. This group carries no `update-types`, so majors are included
      # and arrive as the one change that can actually pass, the week the peer range widens.
      #
      # It is listed first because a dependency joins the first group whose patterns match.
      typescript:
        patterns: ["typescript", "typescript-eslint", "@typescript-eslint/*"]
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 is deferred, not declined. Grouping the toolchain above is necessary but
      # not sufficient: a group bundles the updates that EXIST, and it cannot make
      # typescript-eslint move when no release of it accepts TypeScript 7 yet. So Dependabot
      # raises `typescript` alone, `npm ci` fails at peer resolution before any compile, and
      # the pull request is red the moment it opens. #364 was that, and #368 was it again
      # after the group landed.
      #
      # Lifting this is one line, and it is NOT left to memory:
      # tests/test_repo_hygiene.py pins typescript-eslint's locked `typescript` peer range and
      # fails the day it changes, which is the day to check whether this can go.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels: ["Kind/Frontend", "Kind/Chore", "Priority/Low"]
    commit-message:
      prefix: "build"
      include: "scope"
    open-pull-requests-limit: 5
