# SPDX-License-Identifier: AGPL-3.0-or-later
name: Submit to WinGet

# Publish the released Windows installer to microsoft/winget-pkgs (the flow
# Tautulli uses). Two effects: `winget install ScytheLabs.Reaper` works, and every
# release passes Microsoft's own validation and scanning pipeline, which builds the
# reputation an unsigned installer otherwise lacks. Defender false positives are
# fought on four fronts: winget presence (this workflow), the VirusTotal links
# virustotal.yml appends to each release, per-release submission to
# https://www.microsoft.com/en-us/wdsi/filesubmission (manual), and code signing
# (not wired yet; packaging/README.md carries what it would take).
#
# Called from release.yml once the release is published. Not a `release: published`
# trigger: the publish runs under the workflow's own GITHUB_TOKEN, and events an
# action performs with that token never start another workflow — a trigger here
# would sit silent on every CI-cut release. The dispatch form re-submits a version
# by hand.
#
# Two prerequisites nothing in this repository can create:
#   - the ScytheLabs.Reaper manifest must exist in winget-pkgs once (first
#     submission is a hand-written PR; packaging/README.md walks through it)
#   - a WINGET_TOKEN secret: a PAT with public_repo AND workflow scope, which
#     wingetcreate uses to fork winget-pkgs, open the version PR, and keep that
#     fork level. workflow scope is what the sync needs: GitHub refuses a write
#     touching .github/workflows/ without it, and upstream edits its own
#     workflows, so a public_repo-only token syncs until the first such commit
#     and then fails every release after it.
# Without the token this workflow says so and exits green; without the manifest,
# wingetcreate itself fails and the log names the missing package.

on:
  workflow_call:
    inputs:
      version:
        description: "Release version to submit (CalVer, no leading v)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to submit (CalVer, no leading v)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    steps:
      - name: Submit the manifest update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RAW_VERSION: ${{ inputs.version }}
        run: |
          if (-not $env:WINGET_TOKEN) {
            Write-Host "No WINGET_TOKEN secret; skipping winget submission."
            exit 0
          }
          $version = $env:RAW_VERSION -replace '^v', ''
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/Reaper-$version-windows-x64-setup.exe"
          # wingetcreate cannot open a pull request from a fork that trails upstream, and
          # winget-pkgs moves fast enough to strand it between releases. A failing native
          # command sets $LASTEXITCODE rather than throwing, so the try/catch this replaced
          # never fired: a refused sync ran on and died inside wingetcreate, whose message
          # names the stale fork and not the reason it is stale.
          # A first run has no fork yet. That 404 is the one failure wingetcreate itself
          # handles, by forking; every other one stops the run here, where the cause is.
          $env:GH_TOKEN = $env:WINGET_TOKEN
          $owner = gh api user --jq .login
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the WINGET_TOKEN account. The token is unset, expired, or invalid."
          }
          $sync = gh api -X POST "repos/$owner/winget-pkgs/merge-upstream" -f branch=master 2>&1
          if ($LASTEXITCODE -ne 0) {
            if ($sync -match 'Not Found') {
              Write-Host "No $owner/winget-pkgs fork yet; wingetcreate will create one."
            } else {
              Write-Host $sync
              throw "Could not sync $owner/winget-pkgs with upstream. A 422 naming a file under .github/workflows/ means WINGET_TOKEN is missing the workflow scope."
            }
          }
          # wingetcreate is Microsoft's manifest tool. "latest" is deliberate, unlike
          # every pinned action here: the manifest schema it must emit is
          # winget-pkgs' current one, not whatever was current when this line landed.
          Invoke-WebRequest "https://aka.ms/wingetcreate/latest" -OutFile wingetcreate.exe
          .\wingetcreate.exe update ScytheLabs.Reaper `
            --version $version `
            --urls $url `
            --token $env:WINGET_TOKEN `
            --submit
