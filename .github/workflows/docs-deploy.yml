# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Publishes the manual to GitHub Pages.
#
# `ci.yml`'s `site` job builds `manual/` and `website/` on every pull request that touches
# either, so a page reaching here has compiled once. This workflow exists to publish, not to
# check. The `paths` list below is wider than that by one entry: editing this file fires this
# workflow, and `ci.yml` classifies it as `code`, so `site` skips and nothing rebuilds the site
# for it. That is fine, since the pages did not change.
#
# It publishes from `dev`, not from `main`, because `dev` is what operators are running: the
# README tells them to pull `:dev` and says `:latest` follows `main` "once a release is cut",
# which has not happened. `main` is still the initial commit. Publishing from it would document
# a release that does not exist, and in practice would mean the manual never appeared at all.
#
# **Revisit this the moment a first release is cut.** At that point the site should describe the
# released container rather than the tip of development, and the honest answer is probably
# Docusaurus's docs versioning (a snapshot per release, with `dev` served as `next`) rather than
# just moving this trigger to `main` and leaving `dev` readers with stale pages.
#
# `github-pages` is a protected environment whose deployment-branch policy lists `dev` alone. A
# push from any other branch fails in the deploy job below rather than here, so moving this
# trigger means editing that policy in the same change.
name: Deploy the manual

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "manual/**"
      - "website/**"
      - ".github/workflows/docs-deploy.yml"

# Read-only by default. The deploy job below widens this for itself alone, so the build job
# never holds a token that can publish.
permissions:
  contents: read

# One publish at a time, and never cancel one midway: a half-uploaded artifact would be
# deployed as if it were the whole site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `showLastUpdateTime` reads each page's git history, and a shallow clone does not
          # have it: without this every page reports the same date, or none at all.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
