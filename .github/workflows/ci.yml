name: CI

# Prose is gated by `docs.yml` instead of here. Nothing under these paths can change what
# the app does and nothing under them reaches the image -- .dockerignore drops `docs/` and
# `*.md`, the single exception being README.md, which is copied only because pyproject
# declares it as the package readme and hatchling's metadata build fails without it. No
# runtime code reads it. Proving that with a uv install, a mypy pass, a node build and an
# image build costs ~3.5 minutes, and 22% of the last 117 commits touched nothing else.
#
# The path list here and the one in docs.yml are complementary ON PURPOSE: what this file
# ignores is exactly what that file claims, so every commit is gated by one lane or the
# other and none slips through ungated. That is load-bearing, because "it's only docs" is
# false in this repo -- tests/test_repo_hygiene.py reads CLAUDE.md, docs/ and
# .claude/rules/, and a docs-only commit is precisely when it has something to say. Edit
# one list and you must edit the other.
#
# `paths-ignore` skips a run only when EVERY changed file matches, so the ordinary commit
# that edits src/ and docs/STATUS.md together still runs this workflow in full.
#
# One visible consequence: a docs-only commit builds no image, so `:dev` keeps pointing at
# the last commit that could actually change it. The tag is behind the branch by design --
# the image really was built from that code -- rather than being silently rebuilt to carry
# a newer sha with identical contents.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".claude/**"

# A second push to a branch makes the first one's verdict irrelevant: the only sha anyone
# acts on is the tip. Grouping by ref and cancelling the older run means a burst of pushes
# to dev costs one run instead of one per commit, and hands the runner to the push that
# superseded it rather than finishing a verdict about history. main is exempt because it is
# release-only, and cancelling a release build partway through `docker push` is how
# `:latest` ends up half-published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (the tag in the comment is what the SHA was
      # resolved from): a mutable tag on a third-party action is an supply-chain door
      # into the job that builds and publishes the deletion-capable image.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Caching depends on job containers being able to reach the runner's cache server.
      # It only works while the runner shares a network with them (container.network on
      # the runner, rather than the per-job network it creates by default) -- otherwise
      # Docker isolates the two, every restore and save times out, and a cache that always
      # misses is far from free: it once cost this job ~40s and `frontend` ~9m per run, to
      # fetch nothing. If those timeouts reappear, suspect the runner's network, not this.
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # Fail if uv.lock has drifted from pyproject.toml. Without this, a dependency bump
      # that never made it into the lock would still pass CI while the image installs the
      # stale locked versions -- exactly the reproducibility gap we install --frozen to close.
      - name: Assert lockfile is current
        run: uv lock --check

      # Install from the committed lockfile into a project-local venv. `uv sync` creates
      # the venv automatically; subsequent steps use `uv run` so the venv is always on
      # PATH without needing --system (which PEP 668 externally-managed distros reject).
      - name: Install
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy src/reaper

      - name: Test
        run: uv run pytest -n auto --cov --cov-report=term-missing

      # A model change without a migration is the classic way to ship a schema
      # that only exists on the developer's laptop.
      - name: Assert no un-migrated model changes
        run: |
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # See the note on caching in `check`.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `ci`, not `install`: it installs exactly the locked tree and fails if
      # package.json and the lockfile disagree, rather than quietly resolving something
      # new. This is the same command the Dockerfile runs.
      - name: Install
        run: npm ci

      # The two classic react-hooks rules run as errors: a conditional hook or a stale
      # dependency in the execute-gating components is a correctness bug, not style.
      - name: Lint
        run: npm run lint

      # The counterpart to `ruff format --check` in the check job above -- the whole point
      # of adopting prettier was that one half of the tree had a formatting gate and the
      # other half was argued by hand. printWidth matches ruff's line-length; see
      # frontend/prettier.config.mjs for why, and for why nothing else is configured.
      - name: Format
        run: npm run format:check

      # Component tests (vitest + Testing Library), led by the reap confirmation's
      # client-side execute gate -- the one UI surface in front of a deletion.
      - name: Test
        run: npm run test

      # `npm run build` runs tsc --noEmit first, so a type error fails the build rather
      # than shipping a bundle that throws in the browser.
      - name: Typecheck and build
        run: npm run build

  # The shipped artifact is the container, so its buildability must be a checked gate --
  # otherwise a broken COPY order, a stale lock, or a bad base image reaches main green.
  # needs: ensures the image is never built from code that failed lint, type, or test.
  docker:
    runs-on: ubuntu-latest
    needs: [check, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The image path is derived from the run context, never hardcoded, so this
      # workflow is correct for anyone who forks Reaper. The registry is the one
      # thing that cannot be derived: GITHUB_SERVER_URL is github.com, which is
      # not a registry, so ghcr.io is named outright. Docker requires a lowercase
      # image path, but repo owners are commonly capitalized, so the repository
      # slug is lowercased here. A branch name may contain "/", which is not a
      # legal tag character, so it is folded to "-".
      #
      # A pull request publishes as "pr-<number>" so it can be pulled and tested. That
      # cannot collide with a branch tag, and it says plainly what the image is. The tag
      # is not taken from REF_NAME on a PR: there REF_NAME is the PR *number*, which
      # would tag the image ":1" and read like a version.
      - name: Resolve image name
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          echo "IMAGE=ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "TAG=pr-${PR_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')" >> "$GITHUB_ENV"
          fi
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # The short commit and a release flag are baked in as build args so the About page
      # can show which build is running. main is release-only (it shows the plain version);
      # every other branch and PR shows "dev (<short commit>)". REF_NAME is the PR number on
      # a pull request, never "main", so a PR is correctly a dev build.
      - name: Build image
        run: |
          RELEASE=""
          if [ "${GITHUB_REF_NAME}" = "main" ]; then RELEASE="1"; fi
          docker build \
            --build-arg "REAPER_GIT_SHA=${SHORT_SHA}" \
            --build-arg "REAPER_RELEASE=${RELEASE}" \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:${SHORT_SHA}" .

      - name: Tag latest
        if: github.ref_name == 'main'
        run: docker tag "${IMAGE}:${TAG}" "${IMAGE}:latest"

      # The automatic GITHUB_TOKEN publishes here, given the packages: write
      # permission declared on this job, so no operator-provided secret is needed
      # and a fresh fork publishes to its own namespace with no setup.
      #
      # Pull requests publish too, so a reviewer can pull and run the exact image,
      # but only when the PR comes from this repository. On a fork PR the token is
      # read-only and the push would fail rather than leak, but failing a gate on a
      # contributor's first PR is its own cost, so the branch is checked here.
      - name: Push image
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push --all-tags "${IMAGE}"
