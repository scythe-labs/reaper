# SPDX-License-Identifier: AGPL-3.0-or-later
name: PR title

# Pull requests are squash-merged, so the PR title is the commit message that lands on
# `dev` and lives in the history forever. That makes the title the one piece of a pull
# request worth gating: a body can be edited after the fact, and a title cannot be, once
# it has been squashed into a commit.
#
# It also feeds release notes. Conventional Commit types are what a changelog generator
# groups by, so a title that does not parse is a change that quietly goes missing from
# the notes rather than one that fails loudly.
#
# Deliberately narrow: the type must parse and that is all. No scope is required, no
# subject casing is enforced, and the body is not inspected. The repository already
# writes this way without being asked -- 199 of the last 200 commits parse -- so this
# catches the newcomer and the web-UI edit, and stays out of everyone else's way.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The eight types this repository actually uses, plus the three from the
          # Conventional Commits spec that it has not needed yet. Adding a type here is
          # cheaper than a contributor guessing which one is allowed.
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            ci
            chore
            build
            style
            revert
          requireScope: false
          # The escape hatch, for the title that genuinely does not fit the convention.
          # A maintainer adds this label and the check stops applying to that pull
          # request. It is deliberately a label rather than a phrase in the title, so
          # that skipping the gate is a visible act by someone who can merge. The label
          # does not exist until the first time it is needed; create it then.
          ignoreLabels: |
            Status/Ignore Title
