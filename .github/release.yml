#
# What GitHub's generated release notes look like: one section per label, in this
# order, each entry a PR title with its author. workflows/release.yml asks for
# these notes when it drafts a release, over the range since the previous tag.
# A PR with two of these labels lands in the first matching section, so the order
# doubles as precedence; the catch-all keeps an unlabeled PR visible rather than
# silently dropped. GitHub appends New Contributors and the changelog link itself.
changelog:
  # The promotion pull request is the only one that merges into `main`, and the
  # ours-strategy merge that opens the next one pulls it into the notes range. So
  # every release listed the PREVIOUS release's promotion, a repository chore that
  # says nothing about what shipped. Excluding by label drops it before any category
  # is matched. CLAUDE.md's promotion recipe applies the label, and
  # `test_the_promotion_label_is_excluded_from_the_generated_notes` pins the two together.
  exclude:
    labels: [Kind/Release]
  categories:
    - title: 💥 Breaking changes
      labels: [Compat/Breaking]
    - title: 🛡️ Security
      labels: [Kind/Security]
    - title: 🚀 Features
      labels: [Kind/Feature, Kind/Enhancement]
    - title: 🐛 Bug fixes
      labels: [Kind/Bug]
    - title: ♿ Accessibility
      labels: [Kind/Accessibility]
    - title: 📖 Documentation
      labels: [Kind/Documentation]
    - title: 📦 Dependencies
      labels: [dependencies]
    - title: ⚙️ Everything else
      labels: ["*"]
